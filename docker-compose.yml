name: nexora

services:
  # ---------------------------------------------------------------------
  # Application database (metadata: users, pipeline registry, prompts, audit)
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora_dev_password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nexora} -d ${POSTGRES_DB:-nexora}']
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # Source database for local ingestion (ADR-005 data-ingestion path:
  # restore AdventureWorksLT2022 here, extract tables, upload to
  # Databricks — this is the *source*, not the app's own database).
  # ---------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    # Named volumes on some Docker Desktop setups (notably Windows) are
    # created root-owned, which the image's default non-root "mssql" user
    # (uid 10001) can't write to on first boot. Running as root sidesteps
    # that; the entrypoint script still drops privileges appropriately
    # where it needs to.
    user: root
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:-Nexora_dev_password1}
    ports:
      - '${SQLSERVER_PORT:-1433}:1433'
    volumes:
      - sqlserver-data:/var/opt/mssql/data
      - ./infrastructure/sqlserver:/var/opt/mssql/backup:ro
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 15

  # One-shot: restores AdventureWorksLT2022.bak into the sqlserver service,
  # then exits. Safe to re-run (checks for an existing database first).
  sqlserver-restore:
    image: mcr.microsoft.com/mssql-tools:latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:-Nexora_dev_password1}
    volumes:
      # Only the script needs to be visible here — the RESTORE statement's
      # file paths are evaluated by the sqlserver container, not this one.
      - ./infrastructure/sqlserver/restore.sh:/restore.sh:ro
    entrypoint: ['bash', '/restore.sh']
    restart: 'no'

  # ---------------------------------------------------------------------
  # Object storage (bronze/silver/gold, documents) — same key layout the
  # original ADLS Gen2 bronze/SalesLT/... paths used.
  # ---------------------------------------------------------------------
  # NOTE: the official minio/minio image was pulled from Docker Hub behind a
  # login wall in 2025. bitnamilegacy/minio is the free, unauthenticated
  # replacement (frozen, no longer updated, but fine for a local MVP).
  # MINIO_DEFAULT_BUCKETS creates the bucket on first boot, replacing what
  # would otherwise be a separate `mc mb` init container.
  minio:
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nexora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nexora_dev_password}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET:-adventureworks-lt-2022}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # Knowledge graph
  # ---------------------------------------------------------------------
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-nexora_dev_password}
    ports:
      - '${NEO4J_HTTP_PORT:-7474}:7474'
      - '${NEO4J_BOLT_PORT:-7687}:7687'
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:7474 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # Vector database (Context Lake semantic search)
  # ---------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - '${QDRANT_HTTP_PORT:-6333}:6333'
      - '${QDRANT_GRPC_PORT:-6334}:6334'
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/localhost/6333" || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # Local LLM inference
  # ---------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - '${OLLAMA_PORT:-11434}:11434'
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/localhost/11434" || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # Observability: OTel Collector -> Prometheus -> Grafana
  # ---------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ./infrastructure/observability/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - '${OTEL_COLLECTOR_GRPC_PORT:-4317}:4317'
      - '${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318'

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:9090/-/healthy || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-nexora_dev_password}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - '${GRAFANA_PORT:-3000}:3000'
    depends_on:
      prometheus:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------
  spring-boot-api:
    build:
      context: ./backend/spring-boot-api
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nexora}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nexora}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-nexora_dev_password}
      # Databricks control-plane access (ADR-005) — Spring Boot is the only
      # thing that ever sees these; never forwarded to Angular.
      DATABRICKS_HOST: ${DATABRICKS_HOST}
      DATABRICKS_TOKEN: ${DATABRICKS_TOKEN}
      DATABRICKS_JOB_ID: ${DATABRICKS_JOB_ID}
      DATABRICKS_SQL_WAREHOUSE_ID: ${DATABRICKS_SQL_WAREHOUSE_ID}
      # Context Lake (Phase 6) — container-network hostnames, not localhost.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nexora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nexora_dev_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-context-lake-documents}
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      # Knowledge Graph (Phase 7) — container-network hostname, not localhost.
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-nexora_dev_password}
    ports:
      - '${SPRING_API_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy

volumes:
  postgres-data:
  sqlserver-data:
  minio-data:
  neo4j-data:
  qdrant-data:
  ollama-data:
  prometheus-data:
  grafana-data:
