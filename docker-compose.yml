name: nexora

services:
  # ---------------------------------------------------------------------
  # Application database (metadata: users, pipeline registry, prompts, audit)
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora_dev_password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nexora} -d ${POSTGRES_DB:-nexora}']
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # Object storage (bronze/silver/gold, documents) — same key layout the
  # original ADLS Gen2 bronze/SalesLT/... paths used.
  # ---------------------------------------------------------------------
  # NOTE: the official minio/minio image was pulled from Docker Hub behind a
  # login wall in 2025. bitnamilegacy/minio is the free, unauthenticated
  # replacement (frozen, no longer updated, but fine for a local MVP).
  # MINIO_DEFAULT_BUCKETS creates the bucket on first boot, replacing what
  # would otherwise be a separate `mc mb` init container.
  minio:
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nexora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nexora_dev_password}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET:-adventureworks-lt-2022}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # Knowledge graph
  # ---------------------------------------------------------------------
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-nexora_dev_password}
    ports:
      - '${NEO4J_HTTP_PORT:-7474}:7474'
      - '${NEO4J_BOLT_PORT:-7687}:7687'
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:7474 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # Vector database (Context Lake semantic search)
  # ---------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - '${QDRANT_HTTP_PORT:-6333}:6333'
      - '${QDRANT_GRPC_PORT:-6334}:6334'
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/localhost/6333" || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # Local LLM inference
  # ---------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - '${OLLAMA_PORT:-11434}:11434'
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/localhost/11434" || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # Observability: OTel Collector -> Prometheus -> Grafana
  # ---------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ./infrastructure/observability/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - '${OTEL_COLLECTOR_GRPC_PORT:-4317}:4317'
      - '${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318'

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:9090/-/healthy || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-nexora_dev_password}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - '${GRAFANA_PORT:-3000}:3000'
    depends_on:
      prometheus:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------
  spring-boot-api:
    build:
      context: ./backend/spring-boot-api
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nexora}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nexora}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-nexora_dev_password}
    ports:
      - '${SPRING_API_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  neo4j-data:
  qdrant-data:
  ollama-data:
  prometheus-data:
  grafana-data:
