<header class="topbar">
  <h1 class="page-title">{{ pageTitle }}</h1>

  <div class="search">
    <app-icon name="search" [size]="15" />
    <input type="text" placeholder="Ask AI or search metrics..." />
    <kbd>⌘K</kbd>
  </div>

  <div class="actions">
    <button class="icon-btn" type="button" title="AI Assistant">
      <app-icon name="sparkles" [size]="18" />
    </button>
    <button class="icon-btn" type="button" title="Notifications">
      <app-icon name="bell" [size]="18" />
    </button>
    <button class="icon-btn" type="button" title="Help">
      <app-icon name="help-circle" [size]="18" />
    </button>
    <div class="user">
      <div class="avatar">AM</div>
      <div class="user-meta">
        <span class="user-name">Admin User</span>
        <span class="user-plan">Enterprise Plan</span>
      </div>
    </div>
  </div>
</header>
