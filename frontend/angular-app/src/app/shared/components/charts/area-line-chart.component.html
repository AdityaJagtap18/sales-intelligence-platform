<svg class="area-chart" [attr.viewBox]="viewBox" preserveAspectRatio="none">
  <defs>
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--color-accent)" stop-opacity="0.28" />
      <stop offset="100%" stop-color="var(--color-accent)" stop-opacity="0" />
    </linearGradient>
  </defs>

  <path class="area" [attr.d]="areaPath" fill="url(#areaFill)" />
  @if (expectedPath) {
    <path class="expected-line" [attr.d]="expectedPath" fill="none" stroke="var(--color-text-muted)" stroke-width="1.5" stroke-dasharray="4 4" />
  }
  <path class="line" [attr.d]="linePath" fill="none" stroke="var(--color-accent)" stroke-width="2.5" />

  @for (m of anomalyMarkers; track m.x) {
    <circle [attr.cx]="m.x" [attr.cy]="m.y" r="5" fill="var(--color-bg)" stroke="var(--color-accent)" stroke-width="2.5" />
  }
</svg>

<div class="x-labels">
  @for (l of labelPositions; track l.label) {
    <span>{{ l.label }}</span>
  }
</div>
