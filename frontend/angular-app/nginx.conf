server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Angular client-side routing: unknown paths fall back to index.html
    # rather than a static 404, so a hard refresh on e.g. /overview/executive
    # still loads the app instead of nginx's own error page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
