name: sellix

# Production compose. Deliberately smaller than docker-compose.yml (local dev):
#   - No sqlserver/sqlserver-restore: those exist only to seed Databricks from
#     the local AdventureWorksLT backup during development. Databricks is
#     already the live data source in production; nothing here needs them.
#   - No otel-collector/prometheus/grafana: a separate, optional observability
#     pipeline the app's own pages don't read from (Logs & Traces/Metrics use
#     the API's own in-memory buffers, not Prometheus). Skipped to fit a
#     1 vCPU/4GB box.
# Images are built by CI and pulled here, never built on the VPS (see
# VPS_DEPLOYMENT_PLAYBOOK.md step 3 — this box is too small to build a
# Maven/Node image next to a live site without risking it).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sellix}
      POSTGRES_USER: ${POSTGRES_USER:-sellix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a real password in .env.prod}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sellix} -d ${POSTGRES_DB:-sellix}']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sellix}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set a real password in .env.prod}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET:-adventureworks-lt-2022}
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set a real password in .env.prod}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:7474 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/localhost/6333" || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/localhost/11434" || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  spring-boot-api:
    image: ghcr.io/${GHCR_REPO:-adityajagtap18/sales-intelligence-platform}-backend:latest
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sellix}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sellix}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set a real password in .env.prod}
      DATABRICKS_HOST: ${DATABRICKS_HOST:?set in .env.prod}
      DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:?set in .env.prod}
      DATABRICKS_JOB_ID: ${DATABRICKS_JOB_ID}
      DATABRICKS_SQL_WAREHOUSE_ID: ${DATABRICKS_SQL_WAREHOUSE_ID}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sellix}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set a real password in .env.prod}
      MINIO_BUCKET: ${MINIO_BUCKET:-context-lake-documents}
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      # 1.5b, not the 3b model used locally — this box is 1 vCPU/4GB RAM,
      # shared with another live project, with no room for a heavier model.
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:1.5b}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set a real password in .env.prod}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?set to https://your-subdomain in .env.prod}
    ports:
      - '127.0.0.1:${SPRING_API_PORT:-18080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  frontend:
    image: ghcr.io/${GHCR_REPO:-adityajagtap18/sales-intelligence-platform}-frontend:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-18081}:80'
    depends_on:
      - spring-boot-api

volumes:
  postgres-data:
  minio-data:
  neo4j-data:
  qdrant-data:
  ollama-data:
