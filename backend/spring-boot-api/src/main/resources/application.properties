spring.application.name=spring-boot-api
server.port=8080
server.servlet.context-path=/api

# Postgres connection is read from env in later phases; left disabled for the Phase 2 shell
# since no entities/repositories exist yet and we don't want startup to require a live DB.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.JpaRepositoriesAutoConfiguration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
