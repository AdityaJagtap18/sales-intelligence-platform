spring.application.name=spring-boot-api
server.port=8080
server.servlet.context-path=/api

# Postgres now comes from the Phase 3 Compose stack. Defaults match
# docker-compose.yml / .env.example so `mvnw spring-boot:run` against a
# locally-running `docker compose up postgres` works without extra setup.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/nexora}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:nexora}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:nexora_dev_password}
# Phase 5 introduces the first entity (pipeline_run); its table is created by
# schema.sql rather than Hibernate auto-ddl, and ddl-auto stays on validate so
# the entity mapping is checked against that schema, not left to infer one.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always

management.endpoints.web.exposure.include=health,info,prometheus,httpexchanges
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# Databricks control plane (ADR-005). Spring Boot is the only component that
# ever holds these; the REST endpoints in PipelineController never return the
# host/token to callers (Angular included).
databricks.host=${DATABRICKS_HOST:}
databricks.token=${DATABRICKS_TOKEN:}
databricks.job-id=${DATABRICKS_JOB_ID:}
databricks.sql-warehouse-id=${DATABRICKS_SQL_WAREHOUSE_ID:}
# How often the data-quality gauge poller re-queries
# workspace.nexora.data_quality_report via the SQL Warehouse.
databricks.quality-poll-interval-ms=${DATABRICKS_QUALITY_POLL_INTERVAL_MS:60000}
# How often the dataset catalog re-syncs row counts/columns for
# workspace.gold.* from Unity Catalog.
databricks.catalog-sync-interval-ms=${DATABRICKS_CATALOG_SYNC_INTERVAL_MS:300000}
# GDPR Art. 5(1)(e) storage limitation: how long ai_insight_run / prompt_run
# rows (this app's AI-usage audit trail) are kept before DataRetentionService
# purges them. 0 disables the sweep.
privacy.ai-log-retention-days=${PRIVACY_AI_LOG_RETENTION_DAYS:90}
# How long DatabricksSqlClient serves a cached result for the same statement
# text before re-querying the SQL Warehouse. Set to 0 to disable caching.
databricks.query-cache-ttl-ms=${DATABRICKS_QUERY_CACHE_TTL_MS:30000}

# Context Lake (Phase 6, ADR-005: MinIO/Qdrant/Ollama stay local). Defaults
# match docker-compose.yml / .env.example for `mvnw spring-boot:run` against
# a locally-running `docker compose up`.
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ROOT_USER:nexora}
minio.secret-key=${MINIO_ROOT_PASSWORD:nexora_dev_password}
minio.bucket=${MINIO_BUCKET:context-lake-documents}
qdrant.url=${QDRANT_URL:http://localhost:6333}
qdrant.collection=${QDRANT_COLLECTION:context_lake_documents}
ollama.url=${OLLAMA_URL:http://localhost:11435}
ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
# Prompt Playground (Phase 8) — a small local chat/generate model.
ollama.chat-model=${OLLAMA_CHAT_MODEL:llama3.2:1b}
# nomic-embed-text's vector size — must match what the Qdrant collection is
# created with; changing the model requires recreating the collection.
qdrant.vector-size=768

# PDFs/markdown uploaded to the Context Lake can be a few MB.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Knowledge Graph (Phase 7). Defaults match docker-compose.yml / .env.example.
neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
neo4j.user=${NEO4J_USER:neo4j}
neo4j.password=${NEO4J_PASSWORD:nexora_dev_password}
# How often the graph re-syncs from Gold + Context Lake data.
graph.sync-interval-ms=${GRAPH_SYNC_INTERVAL_MS:600000}
