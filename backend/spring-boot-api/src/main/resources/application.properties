spring.application.name=spring-boot-api
server.port=8080
server.servlet.context-path=/api

# Postgres now comes from the Phase 3 Compose stack. Defaults match
# docker-compose.yml / .env.example so `mvnw spring-boot:run` against a
# locally-running `docker compose up postgres` works without extra setup.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nexora}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:nexora}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:nexora_dev_password}
# No entities exist yet (Phase 4+); validate the connection, don't try to
# manage a schema that isn't defined anywhere.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
